version: "3.8"

services:
  nginx:
    # Explicit version + manifest-list digest prevents silent tag drift while
    # retaining multi-architecture scheduling support.
    image: ${NGINX_IMAGE:-nginx:1.30.3-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1}
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    command: >
      /bin/sh -c "nginx -g 'daemon off;' &
      nginx_pid=$$!;
      while sleep 6h; do nginx -s reload || true; done &
      reload_pid=$$!;
      trap 'kill -TERM $$nginx_pid $$reload_pid 2>/dev/null || true; wait $$nginx_pid' TERM INT;
      wait $$nginx_pid"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge-net
    volumes:
      - nginx-letsencrypt:/etc/letsencrypt:ro
      - nginx-certbot-webroot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    configs:
      - source: nginx_main_conf
        target: /etc/nginx/nginx.conf
      - source: nginx_default_disabled
        target: /etc/nginx/conf.d/default.conf
      - source: nginx_http_conf
        target: /etc/nginx/conf.d/00-http.conf
      - source: nginx_routes_conf
        target: /etc/nginx/conf.d/10-routes.conf
      - source: nginx_auth_infra
        target: /etc/nginx/snippets/auth-infra.conf
      - source: nginx_proxy_common
        target: /etc/nginx/snippets/proxy-common.conf
      - source: nginx_ratelimit_infra
        target: /etc/nginx/snippets/ratelimit-infra.conf
      - source: nginx_security_headers
        target: /etc/nginx/snippets/security-headers.conf
      - source: nginx_security_headers_embed
        target: /etc/nginx/snippets/security-headers-embed.conf
      - source: nginx_ssl_params
        target: /etc/nginx/snippets/ssl-params.conf
      - source: nginx_superset_cors
        target: /etc/nginx/snippets/superset-cors.conf
      - source: nginx_infra_htpasswd
        target: /etc/nginx/auth/infra.htpasswd
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20}
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet --no-random-sleep-on-renew;
        sleep 12h & wait $$!;
      done"
    volumes:
      - nginx-letsencrypt:/etc/letsencrypt
      - nginx-certbot-webroot:/var/www/certbot
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s
      placement:
        constraints:
          - node.role == manager

networks:
  edge-net:
    external: true
    name: ${EDGE_NETWORK:-edge-net}

volumes:
  nginx-letsencrypt:
    external: true
  nginx-certbot-webroot:
    external: true
  nginx-logs:
    external: true

configs:
  nginx_main_conf:
    name: ${CONFIG_PREFIX:-nginx}_main_conf_${NGINX_CONFIG_VERSION:-v1}
    file: ./nginx.conf
  nginx_default_disabled:
    name: ${CONFIG_PREFIX:-nginx}_default_disabled_${NGINX_CONFIG_VERSION:-v1}
    file: ./conf.d/default.disabled.conf
  nginx_http_conf:
    name: ${CONFIG_PREFIX:-nginx}_http_conf_${NGINX_CONFIG_VERSION:-v1}
    file: ./conf.d/00-http.conf
  nginx_routes_conf:
    name: ${CONFIG_PREFIX:-nginx}_routes_conf_${NGINX_CONFIG_VERSION:-v1}
    file: ./conf.d/10-routes.conf
  nginx_auth_infra:
    name: ${CONFIG_PREFIX:-nginx}_auth_infra_${NGINX_CONFIG_VERSION:-v1}
    file: ./snippets/auth-infra.conf
  nginx_proxy_common:
    name: ${CONFIG_PREFIX:-nginx}_proxy_common_${NGINX_CONFIG_VERSION:-v1}
    file: ./snippets/proxy-common.conf
  nginx_ratelimit_infra:
    name: ${CONFIG_PREFIX:-nginx}_ratelimit_infra_${NGINX_CONFIG_VERSION:-v1}
    file: ./snippets/ratelimit-infra.conf
  nginx_security_headers:
    name: ${CONFIG_PREFIX:-nginx}_security_headers_${NGINX_CONFIG_VERSION:-v1}
    file: ./snippets/security-headers.conf
  nginx_security_headers_embed:
    name: ${CONFIG_PREFIX:-nginx}_security_headers_embed_${NGINX_CONFIG_VERSION:-v1}
    file: ./snippets/security-headers-embed.conf
  nginx_ssl_params:
    name: ${CONFIG_PREFIX:-nginx}_ssl_params_${NGINX_CONFIG_VERSION:-v1}
    file: ./snippets/ssl-params.conf
  nginx_superset_cors:
    name: ${CONFIG_PREFIX:-nginx}_superset_cors_${NGINX_CONFIG_VERSION:-v1}
    file: ./snippets/superset-cors.conf
  nginx_infra_htpasswd:
    name: ${CONFIG_PREFIX:-nginx}_infra_htpasswd_${NGINX_CONFIG_VERSION:-v1}
    file: ${INFRA_HTPASSWD_FILE:-./auth/infra.htpasswd}
