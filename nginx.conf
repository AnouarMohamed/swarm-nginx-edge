user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'host="$host" upstream="$upstream_addr" upstream_status="$upstream_status" '
        'request_time="$request_time" upstream_time="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    client_max_body_size 300m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/xml
        font/opentype
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Administrative UIs do not need API-gateway throughput. Thirty requests
    # per second with a short burst absorbs normal page loads and throttles abuse.
    limit_req_zone $binary_remote_addr zone=infra_per_ip:20m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=infra_conn_per_ip:20m;

    include /etc/nginx/conf.d/*.conf;
}
