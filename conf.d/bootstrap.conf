server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/bootstrap.access.log main;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    return 444;
}

server {
    listen 80;
    server_name
        db-admin.example.com
        db-development.example.com
        mongodb-admin.example.com
        portainer.example.com
        jenkins.example.com
        glpi.example.com
        superset.example.com
        passbolt.example.com
        wordpress-school.example.com
        wordpress-invoice.example.com
        wordpress-portfolio.example.com
        wordpress-community.example.com
        wordpress-resume.example.com
        wordpress-blog.example.com
        edge-status.example.com;

    access_log /var/log/nginx/bootstrap.access.log main;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "nginx certbot bootstrap is running\n";
    }
}
