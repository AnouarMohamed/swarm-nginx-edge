server {
    listen 443 ssl;
    http2 on;
    server_name superset.example.com;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers-embed.conf;
    include /etc/nginx/snippets/superset-cors.conf;

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }

        set $upstream "http://superset_superset:8088";
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass $upstream;
    }
}

