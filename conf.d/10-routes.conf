server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name edge-status.example.com;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/auth-infra.conf;
    include /etc/nginx/snippets/ratelimit-infra.conf;

    location = /nginx_status {
        stub_status;
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 200 "nginx reverse proxy is running\n";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name db-admin.example.com;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/auth-infra.conf;

    location / {
        set $upstream "http://mysql-admin_phpmyadmin:80";
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass $upstream;
    }
}

